apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ebook-translator.fullname" . }}-config
  labels:
    {{- include "ebook-translator.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  DATABASE_URL: {{ .Values.config.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.config.REDIS_URL | quote }}
  CELERY_QUEUE_NAME: {{ .Values.config.CELERY_QUEUE_NAME | quote }}
  SUPABASE_URL: {{ .Values.config.SUPABASE_URL | quote }}
  SUPABASE_JWKS_URL: {{ .Values.config.SUPABASE_JWKS_URL | quote }}
  SUPABASE_JWT_ISSUER: {{ .Values.config.SUPABASE_JWT_ISSUER | quote }}
  SUPABASE_JWT_AUDIENCE: {{ .Values.config.SUPABASE_JWT_AUDIENCE | quote }}
  SUPABASE_ADMIN_ROLE: {{ .Values.config.SUPABASE_ADMIN_ROLE | quote }}
  R2_REGION: {{ .Values.config.R2_REGION | quote }}
  R2_RAW_BUCKET: {{ .Values.config.R2_RAW_BUCKET | quote }}
  R2_RESULT_BUCKET: {{ .Values.config.R2_RESULT_BUCKET | quote }}
  MAX_UPLOAD_BYTES: {{ .Values.config.MAX_UPLOAD_BYTES | quote }}
  DAILY_JOBS_LIMIT_PER_USER: {{ .Values.config.DAILY_JOBS_LIMIT_PER_USER | quote }}
  PRESIGNED_PUT_EXPIRES_SECONDS: {{ .Values.config.PRESIGNED_PUT_EXPIRES_SECONDS | quote }}
  PRESIGNED_GET_EXPIRES_SECONDS: {{ .Values.config.PRESIGNED_GET_EXPIRES_SECONDS | quote }}
  OBJECT_TTL_HOURS: {{ .Values.config.OBJECT_TTL_HOURS | quote }}
  ALLOWED_ENGINES_CSV: {{ .Values.config.ALLOWED_ENGINES_CSV | quote }}
  OPENAI_MODEL: {{ .Values.config.OPENAI_MODEL | quote }}
  DEEPINFRA_MODEL: {{ .Values.config.DEEPINFRA_MODEL | quote }}
  DEEPINFRA_ENDPOINT: {{ .Values.config.DEEPINFRA_ENDPOINT | quote }}
  NEXT_PUBLIC_SUPABASE_URL: {{ .Values.config.NEXT_PUBLIC_SUPABASE_URL | quote }}
  NEXT_PUBLIC_API_BASE_URL: {{ .Values.config.NEXT_PUBLIC_API_BASE_URL | quote }}
---
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ebook-translator.fullname" . }}-secret
  labels:
    {{- include "ebook-translator.labels" . | nindent 4 }}
type: Opaque
stringData:
  R2_ACCOUNT_ID: {{ .Values.secretEnv.R2_ACCOUNT_ID | quote }}
  R2_ACCESS_KEY_ID: {{ .Values.secretEnv.R2_ACCESS_KEY_ID | quote }}
  R2_SECRET_ACCESS_KEY: {{ .Values.secretEnv.R2_SECRET_ACCESS_KEY | quote }}
  OPENAI_API_KEYS_CSV: {{ .Values.secretEnv.OPENAI_API_KEYS_CSV | quote }}
  DEEPL_API_KEYS_CSV: {{ .Values.secretEnv.DEEPL_API_KEYS_CSV | quote }}
  GOOGLE_API_KEYS_CSV: {{ .Values.secretEnv.GOOGLE_API_KEYS_CSV | quote }}
  DEEPINFRA_API_KEYS_CSV: {{ .Values.secretEnv.DEEPINFRA_API_KEYS_CSV | quote }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: {{ .Values.secretEnv.NEXT_PUBLIC_SUPABASE_ANON_KEY | quote }}
{{- end }}
